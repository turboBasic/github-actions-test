# `mise run lint` runs this file, so this file is what `python-ci`'s lint stage judges.
#
# The `pre-push` hook below sits outside that: a plain `prek run` fires the pre-commit
# stage, and `mise run test` is what reaches pytest in CI. It existed to give
# `hook-stage: pre-push` something to reach, and stays as a local guard now that `@v0.2`
# has retired that input.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49 # v0.16.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-on-push
        name: pytest (pre-push only)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
