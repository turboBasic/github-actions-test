# The one deviation this branch carries, and it exists to fail. `app-private-key` is withheld, so the
# run must be refused before any job exists — the same failure mode as a permission a caller does not
# grant, and the reason `release-proposal` declares its secrets instead of taking `secrets: inherit`.
# A run that started anyway would reach the App token step holding an empty key.
#
# `main` must never carry this file. The trigger is scoped to this branch for the same reason.

name: 🌜 propose-no-secrets

on:
  push:
    branches: [test/release-proposal]

permissions: {}

jobs:
  shortfall:
    uses: turboBasic/github-actions/.github/workflows/release-proposal.yml@v0.1
    permissions:
      contents: read # granted to nothing: the run is refused before this job exists
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
