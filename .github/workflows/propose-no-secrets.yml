# The shortfall probe, and it exists to fail. `app-private-key` is withheld, so the run must be refused
# before any job exists — the same failure mode as an ungranted permission, and the reason the capability
# declares its secrets rather than inheriting them. A run that started anyway would reach the App token
# step holding an empty key.
#
# Temporary, like the workflow beside it: branch-scoped trigger, feature-branch ref.

name: 🌜 propose-no-secrets

on:
  push:
    branches: [test/release-proposal]

permissions: {}

jobs:
  shortfall:
    uses: turboBasic/github-actions/.github/workflows/release-proposal.yml@feat/publish-release-proposal-as-a-callable-capability
    permissions:
      contents: read # granted to nothing: the run is refused before this job exists
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
