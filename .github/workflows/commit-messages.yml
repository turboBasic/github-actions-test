# Scenario: both checks switched off. The jobs are gated on the same conditions, so they skip — and
# a skipped job reports success. The contexts stay green while validating nothing, which is why the
# README says to remove them from the required checks in the same change.

name: Commit messages

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    uses: turboBasic/github-actions/.github/workflows/conventional-commits.yml@v2
    permissions:
      contents: read
      pull-requests: read
    with:
      check-title: false
      check-commits: false
