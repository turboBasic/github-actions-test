# The compensating control for ci.yml's `lint-changed-only` job: that one can pass while the
# tree is broken, this one reads the whole tree and reports without blocking.

name: prek-advisory

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  advisory:
    uses: turboBasic/github-actions/.github/workflows/prek-advisory.yml@v3
    permissions:
      contents: read
      pull-requests: write
    with:
      hook-stage: pre-push # the same value ci.yml's variants job passes, or the two disagree
      cache-prek: true # explicit only to prove the v3 rename resolves: a stale name is a startup failure
