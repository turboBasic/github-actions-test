# On `opened` only, the shape the README documents. The capability renders into the body as it stands and
# declines rather than overwriting one written without the substitution points.

name: 🌜 pr-description

on:
  pull_request:
    types: [opened]

jobs:
  describe:
    permissions:
      contents: read
      pull-requests: write
    uses: turboBasic/github-actions/.github/workflows/pr-description.yml@v0.1
