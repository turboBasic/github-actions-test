# Three calls: one per component, then one carrying the caller-side configuration nothing inside
# github-actions can exercise itself.
#
# Verification only — the release call lives in release-on-merge.yml.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Each id names the component it judges: the called half is `project-ci` for all three, so the id is
  # the only thing saying which component a check read.
  #
  # This component is the repository root, so the default `working-directory` is under test here too.
  python:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      run-build: false # no build backend here, so there is nothing to compile

  # All four stages on: the build stage is the half of the contract the root component cannot exercise.
  go:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      working-directory: go

  python-no-typecheck:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      run-build: false
      run-typecheck: false # the only thing separating this job from `python`
