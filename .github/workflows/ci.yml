# SCENARIO: every stage switched off. There is nothing left for the capability to judge, so it refuses
# rather than reporting a green check over a job of skipped steps. Do not fix.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      run-lint: false
      run-build: false
      run-typecheck: false
      run-test: false
