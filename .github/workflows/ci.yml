# Three calls on purpose. The first takes every default it can, which is what a new consumer copies out
# of the README. The second is the second component, judged on its own. The third takes the caller-side
# configuration nothing inside github-actions can exercise: docs/ai-instructions.md says a consumer has
# to run those at the ref it pins.
#
# Verification only — the release call lives in release-on-merge.yml.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Each job id names the component it judges, because the called half of every context is `project-ci`
  # for all of them: the id is the only thing that says which component a check read. The third is that
  # same component again under one switch, so it is named for the component and what it varies.
  #
  # The Python component is this repository's root, so no working-directory is passed and the default
  # `.` is under test as well. Nothing is published from here and there is no build backend, so the
  # build stage is switched off at the call site rather than answered by a task that only exits zero.
  python:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@002-project-ci
    permissions:
      contents: read
    with:
      run-build: false

  # The Go component, judged on its own and composing its own required context. All four stages on: it
  # is the half of the contract the Python component cannot exercise, having nothing to compile.
  go:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@002-project-ci
    permissions:
      contents: read
    with:
      working-directory: go

  python-no-typecheck:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@002-project-ci
    permissions:
      contents: read
    with:
      run-build: false
      # The typecheck stage switched off entirely, so this job differs from `python` by that alone.
      run-typecheck: false
