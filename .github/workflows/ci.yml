# SCENARIO: a repository with no typecheck task and no test task, which is opus-magnum's actual shape —
# its checks are make wrappers. Both stages are switched off, so the run does lint and nothing else.
# Leave either input at its default and the run fails naming a task this repository does not define.
#
# One job, not main's three, which is why `go / project-ci` and `python-no-typecheck / project-ci` are
# not required contexts: they would never report here.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      run-build: false
      run-typecheck: false
      run-test: false
