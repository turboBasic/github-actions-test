# Two calls on purpose. The first takes every default, which is what a new consumer copies out
# of the README. The second takes the caller-side configuration nothing inside github-actions can
# exercise: docs/ai-instructions.md says a consumer has to run those at the ref it pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read

  # The third caller-side shape nothing inside github-actions can exercise: its release is a *called*
  # workflow now, gated on `needs: [ci]` rather than on a trigger, and that wiring only ever runs on a
  # push to a default branch. This repo has no tags, so a release here also takes the two branches
  # github-actions itself will not — an empty "highest release", and creating the major tag with POST
  # instead of moving it.
  #
  # Pinned to a branch on purpose, which no other call site here does: this is the version under
  # review. It goes back to @vN once that lands.
  release:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: turboBasic/github-actions/.github/workflows/release.yml@002-commit-driven-releases
    permissions:
      contents: write

  variants:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
    with:
      # prek over changed files instead of the lint task, at the stage this repo reserves its
      # slow hook for, with the typecheck stage switched off entirely.
      lint-changed-only: true
      hook-stage: pre-push
      run-typecheck: false
