# Scenario: this repo names its mise tasks check / types / spec, not lint / typecheck / test.
# The three *-task inputs are what let a consumer keep its own names. Drop them and the job fails
# looking for a task that does not exist, which is the whole point of testing it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
    with:
      lint-task: check
      typecheck-task: types
      test-task: spec
