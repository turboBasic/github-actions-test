# Two calls on purpose. The first takes every default, which is what a new consumer copies out
# of the README. The second takes the caller-side configuration nothing inside github-actions can
# exercise: docs/ai-instructions.md says a consumer has to run those at the ref it pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read

  # The release job that lived here is gone with the branch it called. It rehearsed
  # turboBasic/github-actions#54 — a release cut by a job with `needs: [ci]` rather than by a trigger —
  # and produced v0.1.0 and v0, which are the tags this repo now carries. Restore it once that lands,
  # pinned to `@vN` like every other call here:
  #
  #   release:
  #     needs: [ci]
  #     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #     uses: turboBasic/github-actions/.github/workflows/release.yml@vN
  #     permissions:
  #       contents: write
  #
  # Removed rather than repointed because a reusable-workflow `uses:` is resolved when the run is
  # created, not when the job starts: a dead ref fails the whole run even though the `if:` would have
  # skipped the job. `.cliff.toml` and the git-cliff pin stay — they are what that workflow renders
  # with, and the job needs them back unchanged.

  variants:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
    with:
      # prek over changed files instead of the lint task, at the stage this repo reserves its
      # slow hook for, with the typecheck stage switched off entirely.
      lint-changed-only: true
      hook-stage: pre-push
      run-typecheck: false
