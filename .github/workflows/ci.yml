# SCENARIO: this repository names its mise tasks `check`, `types` and `spec`, and calls `project-ci`
# anyway. There is no input to map them onto the contract's four names — that is what makes this red.
# The call below is `main`'s, minus the two component jobs, and is otherwise unremarkable: nothing at a
# call site can compensate for a task name, which is the finding. Do not fix.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.3
    permissions:
      contents: read
    with:
      run-build: false
