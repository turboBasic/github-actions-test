# Scenario: a repo with no typecheck and no test mise task, which is opus-magnum's actual shape —
# its tasks are all make wrappers. Both stages are switched off, so the job runs checkout, uv sync
# and lint, and nothing else. Leave either input at its default and the job fails looking for a task
# this repo does not define.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
    with:
      run-typecheck: false
      run-tests: false
