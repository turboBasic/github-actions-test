# Scenario: pin the mise release rather than taking whatever mise-action installs today.
# The default is an empty string, which lets the action choose — fine until it chooses a mise that
# resolves a tool differently from the one on a developer's machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
    with:
      mise-version: 2026.9.0
