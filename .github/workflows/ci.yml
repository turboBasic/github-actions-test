# Two calls on purpose. The first takes every default, which is what a new consumer copies out
# of the README. The second takes the caller-side configuration nothing inside github-actions can
# exercise: docs/ai-instructions.md says a consumer has to run those at the ref it pins.
#
# Verification only — the release call lives in release-on-merge.yml.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v0.2
    permissions:
      contents: read

  variants:
    uses: turboBasic/github-actions/.github/workflows/python-ci.yml@v0.2
    permissions:
      contents: read
    with:
      # The typecheck stage switched off entirely. `lint-changed-only` and `hook-stage` sat here too
      # until `@v0.2` retired both, so this job now differs from the one above by that switch alone.
      run-typecheck: false
