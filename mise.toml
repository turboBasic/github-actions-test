[tools]
git-cliff = "2.13.1"
go = "1.27.1"
prek = "0.5.0"
python = "3.14"
uv = "0.12.8"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install tools, dependencies and git hooks"
run = ["mise install", "mise run deps", "prek install"]

# A dependency of every stage below rather than a step in `project-ci`, which prepares nothing on a
# component's behalf. `--locked` is what tests/scenario-lockfile-drift reddens against.
[tasks.deps]
description = "Install the locked dependencies"
run = "uv sync --locked"

# Through the hook runner, not ruff directly: the capability runs this task and nothing else, so a task
# calling only ruff would leave `.pre-commit-config.yaml`'s whitespace hooks checked by nothing.
# tests/scenario-lint-task-without-prek is the branch that demonstrates that.
[tasks.lint]
description = "Lint everything the hook runner covers"
depends = ["deps"]
run = "prek run --all-files --show-diff-on-failure"

[tasks.typecheck]
description = "Type-check with pyright"
depends = ["deps"]
run = "uv run pyright"

[tasks.test]
description = "Run the test suite"
depends = ["deps"]
run = "uv run pytest"

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]

# `rebase-scenarios.yml` force-pushes every `test/*` branch, so a local copy is stale the moment
# anything lands on `main` and `git pull` on one would replay the old tip as a merge. Discarding the
# local ref is the only correct move, which is why this hard-resets rather than pulls.
[tasks.resync]
description = "Reset local main and test/* branches to origin, pruning and refetching tags"
run = [
  "git switch main",
  "git pull --rebase --autostash",
  "git fetch --all --prune --verbose",
  "git fetch --tags --force",
  '''git for-each-ref --format='%(refname:strip=2)' 'refs/heads/test/*' | while read -r b; do git branch -f "$b" "origin/$b" && echo "reset $b" || echo "gone from origin, left alone: $b"; done''',
  # `-D`, not `-d`: every branch here reached `main` as a squash, so its commits are in no ancestry
  # `-d` can see and it would refuse all of them. `[gone]` is the guard that makes that safe — the
  # branch had an upstream and the remote deleted it, which is what `--delete-branch` on a merge does.
  # A branch that was never pushed has no upstream, is therefore never `[gone]`, and is never touched.
  '''git for-each-ref --format='%(refname:short) %(upstream:track)' refs/heads | while read -r b track; do if [ "$track" = '[gone]' ]; then git branch -D "$b"; fi; done''',
]
