[project]
name = "github-actions-test"
version = "0.1.2"
description = "Test consumer for turboBasic/github-actions"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "pyright>=1.1.390"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No build backend here, so src/ is not installed; pytest and pyright each need pointing at it.
pythonpath = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"

# What a consumer of this repository resolves. Read by turboBasic/github-actions' release.yml from
# this file, since it checks out the caller's tree — so this is where *our* layout is declared rather
# than inheriting theirs. Without it every path counts and any breaking commit refuses a non-major.
[tool.turbobasic-release]
surface-include = ["src/**"]
